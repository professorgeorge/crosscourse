<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crosscourse: AI-Powered Course Co-Design for Universities & Academic Consortia</title>
  <meta name="description" content="AI-assisted course co-design studio for universities and multi-campus academic consortia (2 to 9 partner institutions). Generates standards-aligned LMS Course Cartridges (.imscc), master course handbooks, syllabi, interactive rubrics, and synchronized schedules.">
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Crosscourse">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=zodiak@400,500,700&f[]=general-sans@400,500,600&display=swap">
  <link rel="stylesheet" href="./css/style.css">
  <script>
    try { var t = (JSON.parse(localStorage.getItem('xc:settings') || '{}').theme) || 'auto';
      document.documentElement.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><p style="padding:2rem;font-family:system-ui">Loading Crosscourse…</p></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>Crosscourse needs JavaScript enabled.</noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
